name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,api,anthropic]"
      - name: Lint
        run: ruff check .
      - name: Test (offline, no API key)
        run: pytest
      - name: Benchmark against naive baseline
        run: hprag eval data/eval/halcyon_qa.jsonl --corpus data/corpus --compare-baseline --log-level WARNING

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hprag .
