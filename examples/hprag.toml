# Example configuration. Use with: hprag ask "..." --config examples/hprag.toml
# Every key is optional; anything left out keeps its default (see src/hprag/config.py).

log_level = "INFO"
log_format = "pretty"          # "pretty" for terminals, "json" for log pipelines

[chunking]
max_chars = 600
overlap_sentences = 1

[retrieval]
top_k = 5
candidate_k = 20
embedder = "hashing"           # "sentence-transformers" with: pip install 'hprag[ml]'
reranker = "lexical"           # "cross-encoder" with: pip install 'hprag[ml]'

[guard]
min_retrieval_confidence = 0.35
min_claim_support = 0.55
min_faithfulness = 0.6
contradiction_aborts = true
repair = "drop"                # "drop" | "regenerate" | "none"

[llm]
provider = "extractive"        # "anthropic" with ANTHROPIC_API_KEY set
model = "claude-opus-5-5"
effort = "medium"

[verifier]
kind = "lexical"               # "nli" | "llm" | "ensemble"

[guardrails]
enabled = true
block_injection = true         # prompt injection / jailbreak attempts
block_unsafe = true            # weapons, cyberattacks, violence; supportive reply for self-harm
redact_pii = true              # emails, phones, cards, SSNs, IPs in questions and answers
mask_profanity = true
scan_documents = true          # remove sentences in documents that try to instruct the AI
max_question_chars = 500
cache_size = 256               # 0 turns the verified-answer cache off
rate_limit_per_minute = 60     # 0 turns API rate limiting off
