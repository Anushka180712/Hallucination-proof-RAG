[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hprag"
version = "1.0.0"
description = "Hallucination-proof RAG: grounded answers with citations, claim-level verification, and principled abstention."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Udisha Singh" }]
keywords = ["rag", "llm", "hallucination", "retrieval", "nli", "claude", "faithfulness", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core install is deliberately tiny: numpy only. Everything heavy is an extra,
# so the whole pipeline (and the test-suite) runs offline with zero API keys.
dependencies = ["numpy>=1.24", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
ml = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
all = ["hprag[anthropic,api,ml]"]

[project.scripts]
hprag = "hprag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hprag.api" = ["static/*.html", "static/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]
